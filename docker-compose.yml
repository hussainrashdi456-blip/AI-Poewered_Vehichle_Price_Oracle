version: '3.8'

services:
  car-price-predictor:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: car-price-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./model:/app/model
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3